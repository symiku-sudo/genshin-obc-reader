plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'io.github.symiku.obcreader'
    compileSdk 35
    androidResources { noCompress += ['obc'] }
    defaultConfig {
        applicationId 'io.github.symiku.obcreader'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            if (System.getenv('OBC_SIGNING_FILE')) {
                storeFile file(System.getenv('OBC_SIGNING_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('OBC_SIGNING_PASSWORD')
                keyAlias 'reader'
                keyPassword System.getenv('OBC_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    testBuildType System.getenv('OBC_SIGNING_FILE') ? 'release' : 'debug'
    sourceSets { main { assets.srcDir 'build/generated/reader/assets' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig { version = '3.13' }
    sourceSets { main { srcDir 'build/generated/reader/python' } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
