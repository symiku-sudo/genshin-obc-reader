name: Android offline APK
on:
  workflow_dispatch:
  push:
    branches: [android-offline]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download private corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/android
          gh release download android-corpus-v1 --dir data/android --pattern 'library.sqlite3.*'
          python tools/prepare_android_assets.py
      - name: Shared backend tests
        run: python -m unittest discover -v
      - name: Restore private signing key
        env:
          SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/reader.p12"
          chmod 600 "$RUNNER_TEMP/reader.p12"
          echo "OBC_SIGNING_FILE=$RUNNER_TEMP/reader.p12" >> "$GITHUB_ENV"
          echo "OBC_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          gradle :app:assembleRelease --stacktrace
          python ../tools/verify_android_apk.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-boot-timeout: 300
          working-directory: android
          script: bash ../tools/test_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/device-*.log
            android/device-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: obc-reader-release
          path: android/app/build/outputs/apk/release/*.apk*
