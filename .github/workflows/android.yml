name: Android offline APK
on:
  workflow_dispatch:
  push:
    branches: [android-offline]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download private corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/android
          gh release download android-corpus-v1 --dir data/android --pattern 'library.sqlite3.*'
          python tools/prepare_android_assets.py
      - name: Shared backend tests
        run: python -m unittest discover -v
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        with:
          name: obc-reader-debug
          path: android/app/build/outputs/apk/debug/*.apk
