name: Android offline APK
on:
  workflow_dispatch:
    inputs:
      export_run:
        description: Optional successful run to export as a delta from the prior candidate
        required: false
        default: ''
        type: string
      corpus_release:
        description: Private corpus release tag
        required: true
        default: android-corpus-v1
        type: string
  push:
    branches: [android-offline]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.export_run }}
    # GitHub requires write access to read draft release assets.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Download private corpus
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_RELEASE: ${{ inputs.corpus_release || 'android-corpus-v1' }}
        run: |
          mkdir -p data/android
          gh release download "$CORPUS_RELEASE" --dir data/android --pattern 'library.sqlite3.*'
          python tools/prepare_android_assets.py
          python tools/verify_task_supplement.py android/app/build/generated/reader/assets/resources/research/tasks.obc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reading UI regression tests
        run: |
          npm install --prefix .qa --no-save --no-package-lock jsdom@26.1.0
          node test_reading.cjs
          node test_v12.cjs
          node test_v121.cjs
          node test_v130.cjs
          node test_android_bridge.cjs
      - name: Shared backend tests
        run: python -m unittest discover -v
      - name: Restore private signing key
        env:
          SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/reader.p12"
          chmod 600 "$RUNNER_TEMP/reader.p12"
          echo "OBC_SIGNING_FILE=$RUNNER_TEMP/reader.p12" >> "$GITHUB_ENV"
          echo "OBC_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          gradle :app:assembleRelease --stacktrace
          python ../tools/verify_android_apk.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/signing-verification.txt
          grep -q "Verified using v1 scheme (JAR signing): true" app/build/outputs/apk/release/signing-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: obc-reader-release
          path: |
            android/app/build/outputs/apk/release/*.apk*
            android/app/build/outputs/apk/release/signing-verification.txt
      - name: Download previous release for real upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/upgrade
          gh release download v1.2.1 --dir data/upgrade --pattern 'obc-reader-1.2.1.apk*'
          cd data/upgrade
          sha256sum -c obc-reader-1.2.1.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator image with download retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install 'system-images;android-35;google_apis;x86_64'; then
              exit 0
            fi
            # Discard incomplete SDK downloads before retrying on this ephemeral runner.
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep 5
          done
          exit 1
      - name: Offline Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-boot-timeout: 300
          working-directory: android
          script: bash ../tools/test_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/device-*.log
            android/device-evidence/

  export_delta:
    if: ${{ inputs.export_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Export verified candidate delta
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ inputs.export_run }}
        run: |
          test "$(gh run view "$TARGET_RUN" --json conclusion --jq '.conclusion')" = success
          gh run view "$TARGET_RUN" --json headSha,url,conclusion > provenance.json
          gh run download 43170991697 --name obc-reader-release --dir base
          gh run download "$TARGET_RUN" --name obc-reader-release --dir target
          (cd base && sha256sum -c app-release.apk.sha256)
          (cd target && sha256sum -c app-release.apk.sha256)
          python tools/apk_delta.py create base/app-release.apk target/app-release.apk candidate.delta.gz
          python tools/apk_delta.py apply base/app-release.apk candidate.delta.gz reconstructed.apk
          cmp reconstructed.apk target/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-delta
          path: |
            candidate.delta.gz
            provenance.json
            target/signing-verification.txt
            target/app-release.apk.sha256
