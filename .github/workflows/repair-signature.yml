name: Verify and repair 1.3.1 signing compatibility
on:
  push:
    branches: ['repair/signature-131']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Download original signed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir original previous repaired
          gh release download v1.3.1 --dir original --pattern 'obc-reader-1.3.1.apk*'
          gh release download v1.3.0 --dir previous --pattern 'obc-reader-1.3.0.apk*'
          (cd original && sha256sum -c obc-reader-1.3.1.apk.sha256)
          (cd previous && sha256sum -c obc-reader-1.3.0.apk.sha256)
          echo '54e6ac4d53b36d314b656a5bc9359c1a0f9a2e8496f855267c4cf15fef0fa948  original/obc-reader-1.3.1.apk' | sha256sum -c -
      - name: Remove unsigned build metadata and re-sign with the original developer certificate
        env:
          SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
          OBC_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/reader.p12"
          chmod 600 "$RUNNER_TEMP/reader.p12"
          python tools/repack_signing_compat.py original/obc-reader-1.3.1.apk repaired/unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 repaired/unsigned.apk repaired/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/reader.p12" --ks-key-alias reader --ks-pass env:OBC_SIGNING_PASSWORD --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out repaired/obc-reader-1.3.1.apk repaired/aligned.apk
          rm "$RUNNER_TEMP/reader.p12" repaired/unsigned.apk repaired/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 repaired/obc-reader-1.3.1.apk | tee repaired/signing-verification.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 2d59993be66a227aff2ccb8f5beb094b5766b54d9cc3edf8ad3e65fccaa310a3' repaired/signing-verification.txt
          for scheme in 'v1 scheme (JAR signing)' 'v2 scheme (APK Signature Scheme v2)' 'v3 scheme (APK Signature Scheme v3)'; do grep -Fq "Verified using $scheme: true" repaired/signing-verification.txt; done
          ! grep -q 'not protected by signature' repaired/signing-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 repaired/obc-reader-1.3.1.apk
          python tools/repack_signing_compat.py original/obc-reader-1.3.1.apk repaired/obc-reader-1.3.1.apk --verify
          python tools/verify_android_apk.py repaired/obc-reader-1.3.1.apk
          (cd repaired && sha256sum obc-reader-1.3.1.apk > obc-reader-1.3.1.apk.sha256)
      - name: Preserve original and replacement for rollback
        uses: actions/upload-artifact@v4
        with:
          name: signing-compat-131
          path: |
            original/
            repaired/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real signed upgrade and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          script: bash tools/test_signing_compat.sh
      - name: Replace original release assets without changing URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_signing_compat.py
